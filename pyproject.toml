[project]
name = "jurassic-mcp"
version = "0.1.0"
description = "MCP server for IBM Informix database schema exploration and SQL validation"
authors = [
    { name = "marcgj", email = "mgaspjoval2002@gmail.com" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastmcp>=3.1,<4",
    "IfxPy>=3.0.0",
    "pyyaml>=6.0",
]

[tool.uv]
# IfxPy 3.0.5 ships only a legacy setup.py that passes `use_2to3=True`, which
# setuptools removed in v58. Constrain setuptools inside its isolated build env
# (IfxPy is the only dependency built from source).
build-constraint-dependencies = ["setuptools<58"]

[tool.uv.extra-build-dependencies]
ifxpy = ["wheel"]

[project.scripts]
jurassic-mcp = "jurassic_mcp:main"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"
