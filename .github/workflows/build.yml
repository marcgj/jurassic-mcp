name: build-jurassic-mcp

on:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=main
          cache-to: type=gha,scope=main,mode=max

      - name: Export image tarball
        run: |
          docker pull ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker save ghcr.io/${{ github.repository }}:${{ github.sha }} \
            -o jurassic-mcp-${{ github.sha }}.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jurassic-mcp-image-${{ github.sha }}
          path: jurassic-mcp-${{ github.sha }}.tar
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: jurassic-mcp-${{ github.sha }}.tar
          body: |
            ## Quick install with Docker

            **Option A — Pull from the registry (recommended):**
            ```bash
            docker pull ghcr.io/marcgj/jurassic-mcp:${{ github.ref_name }}
            docker run --rm -i \
              -e JURASSIC_MCP_CONFIG=/app/config.yml \
              -v $(pwd)/config.yml:/app/config.yml:ro \
              ghcr.io/marcgj/jurassic-mcp:${{ github.ref_name }}
            ```

            **Option B — Load from the attached tarball:**
            ```bash
            docker load -i jurassic-mcp-*.tar
            docker run --rm -i \
              -e JURASSIC_MCP_CONFIG=/app/config.yml \
              -v $(pwd)/config.yml:/app/config.yml:ro \
              ghcr.io/marcgj/jurassic-mcp:${{ github.sha }}
            ```

            Don't forget to copy and edit `config.yml`:
            ```bash
            cp config.example.yml config.yml
            # edit host, port, user, password
            ```
