name: build-jurassic-mcp

on:
  push:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: |
          docker build -t jurassic-mcp:${{ github.sha }} .

      - name: Export image tarball
        run: |
          docker save jurassic-mcp:${{ github.sha }} -o jurassic-mcp-${{ github.sha }}.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jurassic-mcp-image-${{ github.sha }}
          path: jurassic-mcp-${{ github.sha }}.tar
          if-no-files-found: error
