name: build-jurassic-mcp

# Build-and-test only. The image bundles the HCL OneDB ODBC driver, whose
# license forbids redistribution, so CI must never publish or store it:
# no registry push, no image tarballs/artifacts/releases, no layer cache.
# Users build the image themselves (`docker build .`), which downloads the
# driver directly from HCL.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure the OneDB driver is not committed
        run: |
          bad=$(git ls-files | grep -E '(^|/)(vendor/|onedb-odbc-driver/)|libthcli|\.so(\.[0-9]+)*$|\.tar$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Driver/binary files must not be committed (license forbids redistribution):"
            echo "$bad"
            exit 1
          fi

      - name: Validate docker compose file
        run: docker compose -f docker-compose.yml config --quiet

      - name: Build image (local only, not pushed)
        run: docker build -t jurassic-mcp:ci .

      - name: Smoke test (driver + package import)
        run: |
          docker run --rm --entrypoint /app/.venv/bin/python jurassic-mcp:ci \
            -c "import IfxPy, jurassic_mcp.server; print('import ok')"
